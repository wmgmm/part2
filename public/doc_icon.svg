<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" width="96" height="120" role="img">
  <!-- The report the reader saved themselves: same page-with-a-folded-corner as
       the skill, HTML, prompt and image icons so the family reads as one, banded
       indigo and ruled like a document. Drawn, not photographed, so it stays
       sharp at the 26-52px the attach strip renders it at. -->
  <defs>
    <clipPath id="docpage">
      <path d="M12 6 H68 L90 28 V108 Q90 114 84 114 H12 Q6 114 6 108 V12 Q6 6 12 6 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#docpage)">
    <rect x="0" y="0" width="96" height="120" fill="#fdfdfe"/>
    <rect x="0" y="0" width="96" height="34" fill="#d4d2ec"/>
  </g>

  <!-- the fold flap, drawn over the band -->
  <path d="M68 6 L90 28 H68 Z" fill="#5b53a6"/>

  <path d="M12 6 H68 L90 28 V108 Q90 114 84 114 H12 Q6 114 6 108 V12 Q6 6 12 6 Z"
        fill="none" stroke="#b3b9c0" stroke-width="2.5" stroke-linejoin="round"/>

  <text x="48" y="57" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700" fill="#443e80" letter-spacing="-0.3">REPORT</text>

  <!-- ruled body text, with a short heading rule to read as a document -->
  <g fill="#5b53a6">
    <rect x="18" y="68" width="30" height="3.4" rx="1.7"/>
  </g>
  <g fill="#c4c9ce">
    <rect x="18" y="78" width="60" height="2.8" rx="1.4"/>
    <rect x="18" y="87" width="60" height="2.8" rx="1.4"/>
    <rect x="18" y="96" width="60" height="2.8" rx="1.4"/>
    <rect x="18" y="105" width="41" height="2.8" rx="1.4"/>
  </g>
</svg>
